# Deploys ONLY the public/ folder to GitHub Pages.
# public-encrypted/ is git-ignored, so it never reaches GitHub, and this
# workflow only ever uploads public/.
name: Deploy public/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Safety check
        run: |
          if [ -e public-encrypted ]; then
            echo "public-encrypted/ is in the repo. It must stay on the PC only. Stopping."
            exit 1
          fi
          if find public -iname "*encrypted*" | grep -q .; then
            echo "Something named *encrypted* is inside public/. Stopping."
            exit 1
          fi
          if find public -iname ".env*" | grep -q .; then
            echo "A .env file is inside public/. Stopping."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
